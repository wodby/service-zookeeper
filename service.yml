name: zookeeper
icon: zookeeper
type: datastore
title: ZooKeeper
guidance: GUIDANCE.md
endpoints:
- name: zookeeper
  ports:
  - name: zookeeper
    number: 2181
    protocol: tcp
options:
- version: '3.9'
  tag: 3.9-r2
  digest: sha256:5f3f4f960c9dcd2b2e8c95c2fcccf7670c9039976b7482e82de3d5fada5d1e45
labels:
- zookeeper

deployment:
  strategy: rolling
  minReady: 10s
  shutdownGracePeriod: 30s

helm:
  name: wodby
  source: oci://registry-1.docker.io/wodby/zookeeper
  chart: oci://registry-1.docker.io/wodby/zookeeper
  version: 0.2.2
  values:
  - name: resourcesPreset
    value: 'none'

volumes:
- name: data
  title: Data
  optional: true
  size: 5
  helm:
    labels: persistence.labels
    values:
    - name: persistence.enabled
      value: true
    - name: persistence.size
      value: '{{volumes.data.size}}Gi'
    - name: persistence.storageClass
      value: '{{volumes.data.storageClassName}}'

workloads:
- name: main
  selector:
    matchLabels:
      app.kubernetes.io/instance: '{{helm.release}}'
  kind: statefulset
  primary: true
  helm:
    labels: commonLabels
    annotations: commonAnnotations
    volumes: extraVolumes
  containers:
  - name: zookeeper
    image: wodby/zookeeper
    resources:
      request:
        cpu: 20
        memory: 96
      limit:
        memory: 2048
    env:
    - name: ZOO_DATA_LOG_DIR
      value: /data/datalog
    helm:
      resources: resources
      env: extraEnvVars
      mounts: extraVolumeMounts
